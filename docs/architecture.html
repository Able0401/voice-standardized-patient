<!doctype html>
<html><head><meta charset="utf-8"><title>VSP figure</title>
<style>
:root{--bg:#ffffff;--ink:#1f2937;--muted:#6b7280;--line:#9ca3af;
 --b:#2563eb;--b-soft:#eff6ff;--b-head:#dbeafe;
 --s:#475569;--s-soft:#f8fafc;--s-head:#e2e8f0;
 --g:#c2410c;--g-soft:#fff7ed;--g-head:#fed7aa;
 --bubble:#ffffff;--lock:#b91c1c;--hide:#fee2e2}
body.dark{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa4b2;--line:#6b7280;
 --b:#60a5fa;--b-soft:#0f1b2d;--b-head:#1e3a5f;
 --s:#94a3b8;--s-soft:#151b23;--s-head:#27303b;
 --g:#fb923c;--g-soft:#231a12;--g-head:#5a3417;
 --bubble:#0d1117;--lock:#f87171;--hide:#3b1a1a}
body{margin:0;background:var(--bg)}
svg{display:block;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.t{fill:var(--ink)} .m{fill:var(--muted)} .h{font-weight:700}
</style></head>
<body>
<svg id="fig" width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>
 <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
 <symbol id="person" viewBox="0 0 60 60"><circle cx="30" cy="18" r="11" fill="currentColor"/><path d="M8 58 C8 40 18 32 30 32 C42 32 52 40 52 58 Z" fill="currentColor"/></symbol>
 <symbol id="lock" viewBox="0 0 20 22"><rect x="2" y="9" width="16" height="12" rx="2.5" fill="currentColor"/><path d="M6 9 V6.5 a4 4 0 0 1 8 0 V9" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
</defs>

<!-- Browser panel -->
<rect x="30" y="170" width="300" height="310" rx="14" fill="var(--b-soft)" stroke="var(--b)" stroke-width="1.5"/>
<path d="M30 184 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v28 h-300 z" fill="var(--b-head)"/>
<text x="180" y="197" text-anchor="middle" class="t h" font-size="17">Student's browser</text>
<use href="#person" x="150" y="232" width="60" height="60" style="color:var(--b)"/>
<text x="180" y="312" text-anchor="middle" class="m" font-size="13">medical student</text>
<rect x="52" y="334" width="256" height="62" rx="12" fill="var(--bubble)" stroke="var(--b)" stroke-width="1.2"/>
<path d="M170 335 l10 -10 l10 10" fill="var(--bubble)" stroke="var(--b)" stroke-width="1.2"/>
<rect x="168" y="334.6" width="24" height="4" fill="var(--bubble)"/>
<text x="180" y="360" text-anchor="middle" class="t" font-size="14.5">"Do you drink anything</text>
<text x="180" y="380" text-anchor="middle" class="t" font-size="14.5">to help you sleep?"</text>
<text x="180" y="443" text-anchor="middle" class="m" font-size="13">Holds only the token.</text>
<text x="180" y="462" text-anchor="middle" class="m" font-size="13">Never sees the case sheet or the key.</text>

<!-- Server panel -->
<rect x="440" y="24" width="320" height="262" rx="14" fill="var(--s-soft)" stroke="var(--s)" stroke-width="1.5"/>
<path d="M440 38 a14 14 0 0 1 14 -14 h292 a14 14 0 0 1 14 14 v28 h-320 z" fill="var(--s-head)"/>
<text x="600" y="51" text-anchor="middle" class="t h" font-size="17">Session server</text>
<rect x="462" y="80" width="276" height="158" rx="8" fill="var(--bubble)" stroke="var(--line)" stroke-width="1"/>
<text x="478" y="104" class="t h" font-size="14">Case sheet · Jieun Kim, 31</text>
<text x="478" y="128" class="t" font-size="13">Complaint: "I can't sleep well."</text>
<text x="478" y="148" class="t" font-size="13">Two months, wakes around 4 a.m.</text>
<rect x="472" y="158" width="256" height="44" rx="5" fill="var(--hide)"/>
<text x="480" y="176" style="fill:var(--lock)" class="h" font-size="12.5">Only if asked:</text>
<text x="480" y="194" class="t" font-size="13">wine before bed, 3–4 nights a week</text>
<text x="478" y="224" class="m" font-size="12.5">+ voice and turn-taking rules</text>
<text x="600" y="266" text-anchor="middle" class="m" font-size="13">Checks the site and a daily limit</text>

<!-- Gemini panel -->
<rect x="870" y="170" width="300" height="310" rx="14" fill="var(--g-soft)" stroke="var(--g)" stroke-width="1.5"/>
<path d="M870 184 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v28 h-300 z" fill="var(--g-head)"/>
<text x="1020" y="197" text-anchor="middle" class="t h" font-size="17">Gemini Live</text>
<use href="#person" x="990" y="232" width="60" height="60" style="color:var(--g)"/>
<text x="1020" y="312" text-anchor="middle" class="m" font-size="13">plays the patient</text>
<rect x="892" y="334" width="256" height="62" rx="12" fill="var(--bubble)" stroke="var(--g)" stroke-width="1.2"/>
<path d="M1010 335 l10 -10 l10 10" fill="var(--bubble)" stroke="var(--g)" stroke-width="1.2"/>
<rect x="1008" y="334.6" width="24" height="4" fill="var(--bubble)"/>
<text x="1020" y="360" text-anchor="middle" class="t" font-size="14.5">"Um… a glass or two of</text>
<text x="1020" y="380" text-anchor="middle" class="t" font-size="14.5">wine, most nights."</text>
<text x="1020" y="443" text-anchor="middle" class="m" font-size="13">Answers from the sealed case sheet</text>
<text x="1020" y="462" text-anchor="middle" class="m" font-size="13">and decides when a turn ends.</text>

<!-- 1: browser asks server -->
<path d="M260 170 V120 H432" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#ar)"/>
<circle cx="276" cy="120" r="11" fill="var(--ink)"/><text x="276" y="124.5" text-anchor="middle" font-size="12.5" class="h" fill="var(--bg)">1</text>
<text x="294" y="110" class="t" font-size="13.5">ask for a session</text>

<!-- 2: server mints token at Google, case sheet inside -->
<path d="M760 120 H940 V162" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#ar)"/>
<circle cx="776" cy="120" r="11" fill="var(--ink)"/><text x="776" y="124.5" text-anchor="middle" font-size="12.5" class="h" fill="var(--bg)">2</text>
<text x="794" y="89" class="t" font-size="13.5">seal the case sheet into</text>
<text x="794" y="108" class="t" font-size="13.5">a one-time token</text>

<!-- 3: token only back to browser -->
<path d="M520 286 V330 H338" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<circle cx="520" cy="300" r="11" fill="var(--ink)"/><text x="520" y="304.5" text-anchor="middle" font-size="12.5" class="h" fill="var(--bg)">3</text>
<g transform="translate(372,316)"><rect width="104" height="28" rx="14" fill="var(--bg)" stroke="var(--lock)" stroke-width="1.3"/><use href="#lock" x="12" y="6" width="14" height="16" style="color:var(--lock)"/><text x="34" y="19" font-size="13" class="h" style="fill:var(--lock)">token only</text></g>

<!-- 4: live conversation -->
<path d="M338 420 H862" fill="none" stroke="var(--ink)" stroke-width="2.6" marker-start="url(#arB)" marker-end="url(#arB)"/>
<circle cx="600" cy="420" r="12" fill="var(--ink)"/><text x="600" y="424.5" text-anchor="middle" font-size="13" class="h" fill="var(--bg)">4</text>
<text x="600" y="400" text-anchor="middle" class="t h" font-size="14.5">spoken interview, browser ↔ Google directly</text>
<text x="600" y="450" text-anchor="middle" class="m" font-size="13">the session server is no longer involved</text>
</svg>
</body></html>
