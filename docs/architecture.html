<!doctype html>
<html><head><meta charset="utf-8"><title>VSP figure</title>
<style>
:root{--bg:#ffffff;--ink:#1f2937;--muted:#6b7280;--line:#9ca3af;--card:#ffffff;
 --b:#2563eb;--b-soft:#eff6ff;--b-head:#dbeafe;
 --s:#475569;--s-soft:#f8fafc;--s-head:#e2e8f0;
 --g:#c2410c;--g-soft:#fff7ed;--g-head:#fed7aa;
 --p:#7c3aed;--p-soft:#f5f3ff;--p-head:#ddd6fe;
 --hide:#fee2e2;--red:#b91c1c;--row:#1f2937;--rowtxt:#ffffff}
body.dark{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa4b2;--line:#6b7280;--card:#0d1117;
 --b:#60a5fa;--b-soft:#0f1b2d;--b-head:#1e3a5f;
 --s:#94a3b8;--s-soft:#151b23;--s-head:#27303b;
 --g:#fb923c;--g-soft:#231a12;--g-head:#5a3417;
 --p:#a78bfa;--p-soft:#1a1530;--p-head:#3b2d6b;
 --hide:#3b1a1a;--red:#f87171;--row:#e6edf3;--rowtxt:#0d1117}
body{margin:0;background:var(--bg)}
svg{display:block;font-family:"Inter","Helvetica Neue",Arial,sans-serif}
.t{fill:var(--ink)} .m{fill:var(--muted)} .h{font-weight:700} .i{font-style:italic}
</style></head>
<body>
<svg id="fig" width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>
 <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
 <symbol id="person" viewBox="0 0 60 60"><circle cx="30" cy="18" r="11" fill="currentColor"/><path d="M8 58 C8 40 18 32 30 32 C42 32 52 40 52 58 Z" fill="currentColor"/></symbol>
</defs>

<!-- ============ Prompt card (top right) ============ -->
<rect x="640" y="16" width="530" height="262" rx="14" fill="var(--p-soft)" stroke="var(--p)" stroke-width="1.5"/>
<path d="M640 30 a14 14 0 0 1 14 -14 h502 a14 14 0 0 1 14 14 v26 h-530 z" fill="var(--p-head)"/>
<text x="905" y="41" text-anchor="middle" class="t h" font-size="16">Prompt for the patient's line, every turn</text>

<text x="660" y="80" class="t h" font-size="13.5">1  Role</text>
<text x="760" y="80" class="t" font-size="13">"Only answer, as the patient, when the doctor asks."</text>

<text x="660" y="108" class="t h" font-size="13.5">2  Case</text>
<text x="760" y="108" class="t" font-size="13">Jieun Kim, 31 · "I can't sleep well." · history</text>
<rect x="756" y="116" width="396" height="24" rx="5" fill="var(--hide)"/>
<text x="764" y="133" font-size="13"><tspan class="h" style="fill:var(--red)">Only if asked: </tspan><tspan class="t">wine before bed, 3–4 nights a week</tspan></text>

<text x="660" y="164" class="t h" font-size="13.5">3  Portrayal</text>
<text x="760" y="164" class="t" font-size="13">one of two, chosen by the student:</text>
<text x="760" y="182" class="t" font-size="13"><tspan class="h">assessment</tspan>  "Be this person."</text>
<text x="760" y="200" class="t" font-size="13"><tspan class="h">teaching</tspan>  "Answer what you are asked." · answers on a 2nd–3rd try</text>

<text x="660" y="228" class="t h" font-size="13.5">4  Speech</text>
<text x="760" y="228" class="t" font-size="13">text is read verbatim · delivery in style · &lt;sigh&gt; inline</text>

<line x1="656" y1="242" x2="1154" y2="242" stroke="var(--p)" stroke-opacity=".35"/>
<text x="660" y="264" class="m" font-size="12.5">+ the conversation so far · only the portrayal differs between the two</text>

<!-- server -->
<rect x="250" y="70" width="250" height="100" rx="12" fill="var(--s-soft)" stroke="var(--s)" stroke-width="1.4"/>
<text x="375" y="102" text-anchor="middle" class="t h" font-size="15">Turn server</text>
<text x="375" y="124" text-anchor="middle" class="m" font-size="12.5">builds the prompt, asks for the</text>
<text x="375" y="140" text-anchor="middle" class="m" font-size="12.5">line, then relays its audio</text>
<text x="375" y="156" text-anchor="middle" class="m" font-size="12.5">in one streamed reply</text>
<path d="M500 110 H632" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#ar)"/>
<!-- prompt into model -->
<path d="M905 278 V322" fill="none" stroke="var(--p)" stroke-width="2" marker-end="url(#ar)"/>

<!-- browser <-> server -->
<path d="M320 322 V178" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arB)"/>
<text x="312" y="236" text-anchor="end" class="t h" font-size="12.5">question</text>
<text x="312" y="252" text-anchor="end" class="t h" font-size="12.5">text</text>
<path d="M430 178 V322" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arB)" stroke-dasharray="7 4"/>
<text x="440" y="236" class="t h" font-size="12.5">line + voice,</text>
<text x="440" y="252" class="t h" font-size="12.5">streamed</text>

<!-- ============ Student ============ -->
<use href="#person" x="50" y="410" width="64" height="64" style="color:var(--b)"/>
<text x="82" y="496" text-anchor="middle" class="t h" font-size="14">Student</text>

<!-- ============ Browser ============ -->
<rect x="200" y="330" width="330" height="334" rx="14" fill="var(--b-soft)" stroke="var(--b)" stroke-width="1.5"/>
<path d="M200 344 a14 14 0 0 1 14 -14 h302 a14 14 0 0 1 14 14 v26 h-330 z" fill="var(--b-head)"/>
<text x="365" y="355" text-anchor="middle" class="t h" font-size="16">Browser</text>
<text x="220" y="394" class="t" font-size="13">• streams the microphone as it records</text>
<text x="220" y="416" class="t" font-size="13">• plays the patient's voice as it arrives</text>
<text x="220" y="438" class="t" font-size="13">• stops playback if the student cuts in</text>
<text x="220" y="460" class="t" font-size="13">• shows the transcript</text>
<!-- transcript -->
<rect x="216" y="476" width="298" height="172" rx="10" fill="var(--card)" stroke="var(--line)" stroke-opacity=".6"/>
<text x="230" y="498" class="m h" font-size="12">TRANSCRIPT</text>
<rect x="296" y="508" width="206" height="48" rx="10" fill="var(--b-head)"/>
<text x="310" y="528" class="t" font-size="13">Do you drink anything</text>
<text x="310" y="546" class="t" font-size="13">to help you sleep?</text>
<rect x="228" y="566" width="236" height="48" rx="10" fill="var(--g-head)"/>
<text x="242" y="586" class="t" font-size="13">&lt;sigh&gt; Um… a glass or two</text>
<text x="242" y="604" class="t" font-size="13">of wine, most nights.</text>
<text x="230" y="634" class="m i" font-size="11.5">example · style: "a little sheepish"</text>

<!-- student <-> browser -->
<path d="M126 424 H192" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arB)"/>
<text x="159" y="416" text-anchor="middle" class="t" font-size="12.5">speaks</text>
<path d="M192 460 H126" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arB)" stroke-dasharray="6 4"/>
<text x="159" y="478" text-anchor="middle" class="t" font-size="12.5">hears</text>

<!-- ============ Gemini API ============ -->
<rect x="640" y="330" width="530" height="334" rx="14" fill="var(--g-soft)" stroke="var(--g)" stroke-width="1.5"/>
<path d="M640 344 a14 14 0 0 1 14 -14 h502 a14 14 0 0 1 14 14 v26 h-530 z" fill="var(--g-head)"/>
<text x="905" y="355" text-anchor="middle" class="t h" font-size="16">Gemini API · three models per turn</text>

<g font-size="13">
 <rect x="664" y="388" width="482" height="44" rx="6" fill="var(--row)"/>
 <text x="680" y="406" class="h" style="fill:var(--rowtxt)">Listen</text>
 <text x="760" y="406" style="fill:var(--rowtxt)">transcribes the student; the turn ends after</text>
 <text x="760" y="424" style="fill:var(--rowtxt)">1.2 s of silence · gemini-3.5-transcribe-live</text>

 <rect x="664" y="444" width="482" height="44" rx="6" fill="var(--row)"/>
 <text x="680" y="462" class="h" style="fill:var(--rowtxt)">Write</text>
 <text x="760" y="462" style="fill:var(--rowtxt)">the patient's next line and how to say it,</text>
 <text x="760" y="480" style="fill:var(--rowtxt)">from the prompt · gemini-3.8-flash</text>

 <rect x="664" y="500" width="482" height="44" rx="6" fill="var(--row)"/>
 <text x="680" y="518" class="h" style="fill:var(--rowtxt)">Speak</text>
 <text x="760" y="518" style="fill:var(--rowtxt)">reads the line in the patient's voice, with the</text>
 <text x="760" y="536" style="fill:var(--rowtxt)">style and vocal tags · gemini-3.8-flash-tts</text>
</g>
<text x="905" y="580" text-anchor="middle" class="t" font-size="13">The line exists as text before it is spoken,</text>
<text x="905" y="599" text-anchor="middle" class="t" font-size="13">so what the patient said and how can be checked.</text>
<text x="905" y="632" text-anchor="middle" class="m" font-size="12.5">If the student talks over the patient, the browser cuts playback.</text>

<!-- browser <-> gemini (listen) -->
<path d="M530 412 H632" fill="none" stroke="var(--ink)" stroke-width="2.4" marker-end="url(#arB)"/>
<text x="585" y="402" text-anchor="middle" class="t h" font-size="12.5">voice</text>
<path d="M632 450 H530" fill="none" stroke="var(--ink)" stroke-width="2.4" marker-end="url(#arB)" stroke-dasharray="7 4"/>
<text x="585" y="472" text-anchor="middle" class="t h" font-size="12.5">transcript</text>
<text x="585" y="500" text-anchor="middle" class="m" font-size="11.5">one live</text>
<text x="585" y="515" text-anchor="middle" class="m" font-size="11.5">connection</text>
</svg>
</body></html>
