<!doctype html>
<html><head><meta charset="utf-8"><title>VSP figure</title>
<style>
:root{--bg:#ffffff;--ink:#1f2937;--muted:#6b7280;--line:#9ca3af;--card:#ffffff;
 --b:#2563eb;--b-soft:#eff6ff;--b-head:#dbeafe;
 --s:#475569;--s-soft:#f8fafc;--s-head:#e2e8f0;
 --g:#c2410c;--g-soft:#fff7ed;--g-head:#fed7aa;
 --p:#7c3aed;--p-soft:#f5f3ff;--p-head:#ddd6fe;
 --hide:#fee2e2;--red:#b91c1c;--row:#1f2937;--rowtxt:#ffffff}
body.dark{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa4b2;--line:#6b7280;--card:#0d1117;
 --b:#60a5fa;--b-soft:#0f1b2d;--b-head:#1e3a5f;
 --s:#94a3b8;--s-soft:#151b23;--s-head:#27303b;
 --g:#fb923c;--g-soft:#231a12;--g-head:#5a3417;
 --p:#a78bfa;--p-soft:#1a1530;--p-head:#3b2d6b;
 --hide:#3b1a1a;--red:#f87171;--row:#e6edf3;--rowtxt:#0d1117}
body{margin:0;background:var(--bg)}
svg{display:block;font-family:"Inter","Helvetica Neue",Arial,sans-serif}
.t{fill:var(--ink)} .m{fill:var(--muted)} .h{font-weight:700} .i{font-style:italic}
</style></head>
<body>
<svg id="fig" width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>
 <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
 <symbol id="person" viewBox="0 0 60 60"><circle cx="30" cy="18" r="11" fill="currentColor"/><path d="M8 58 C8 40 18 32 30 32 C42 32 52 40 52 58 Z" fill="currentColor"/></symbol>
</defs>

<!-- ============ Prompt card (top right) ============ -->
<rect x="640" y="16" width="530" height="226" rx="14" fill="var(--p-soft)" stroke="var(--p)" stroke-width="1.5"/>
<path d="M640 30 a14 14 0 0 1 14 -14 h502 a14 14 0 0 1 14 14 v26 h-530 z" fill="var(--p-head)"/>
<text x="905" y="41" text-anchor="middle" class="t h" font-size="16">Prompt, fixed for the whole session</text>

<text x="660" y="80" class="t h" font-size="13.5">1  Role</text>
<text x="740" y="80" class="t" font-size="13">"Only answer, as the patient, when the doctor asks."</text>
<text x="740" y="98" class="t" font-size="13">"Do not name a diagnosis or treatment first."</text>

<text x="660" y="126" class="t h" font-size="13.5">2  Case</text>
<text x="740" y="126" class="t" font-size="13">Jieun Kim, 31 · "I can't sleep well." · history, answered when asked</text>
<rect x="736" y="134" width="416" height="24" rx="5" fill="var(--hide)"/>
<text x="744" y="151" font-size="13"><tspan class="h" style="fill:var(--red)">Only if asked: </tspan><tspan class="t">wine before bed, 3–4 nights a week</tspan></text>

<text x="660" y="184" class="t h" font-size="13.5">3  Voice</text>
<text x="740" y="184" class="t" font-size="13">"Keep listening while the student pauses to think."</text>

<line x1="656" y1="200" x2="1154" y2="200" stroke="var(--p)" stroke-opacity=".35"/>
<text x="660" y="224" class="m" font-size="12.5">Settings: patient voice · turn ends after 2.5 s of silence · transcribe both sides</text>

<!-- server builds prompt -->
<rect x="250" y="70" width="250" height="80" rx="12" fill="var(--s-soft)" stroke="var(--s)" stroke-width="1.4"/>
<text x="375" y="102" text-anchor="middle" class="t h" font-size="15">Session server</text>
<text x="375" y="124" text-anchor="middle" class="m" font-size="12.5">assembles the prompt once,</text>
<text x="375" y="140" text-anchor="middle" class="m" font-size="12.5">at the start of a session</text>
<path d="M500 110 H632" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#ar)"/>
<!-- prompt into model -->
<path d="M905 242 V282" fill="none" stroke="var(--p)" stroke-width="2" marker-end="url(#ar)"/>
<text x="915" y="266" class="m" font-size="12.5">system instruction</text>

<!-- ============ Student ============ -->
<use href="#person" x="50" y="370" width="64" height="64" style="color:var(--b)"/>
<text x="82" y="456" text-anchor="middle" class="t h" font-size="14">Student</text>

<!-- ============ Browser ============ -->
<rect x="200" y="290" width="330" height="334" rx="14" fill="var(--b-soft)" stroke="var(--b)" stroke-width="1.5"/>
<path d="M200 304 a14 14 0 0 1 14 -14 h302 a14 14 0 0 1 14 14 v26 h-330 z" fill="var(--b-head)"/>
<text x="365" y="315" text-anchor="middle" class="t h" font-size="16">Browser</text>
<text x="220" y="354" class="t" font-size="13">• streams the microphone as it records</text>
<text x="220" y="376" class="t" font-size="13">• plays the patient's voice</text>
<text x="220" y="398" class="t" font-size="13">• stops playback if the student cuts in</text>
<text x="220" y="420" class="t" font-size="13">• shows the transcript</text>
<!-- transcript -->
<rect x="216" y="436" width="298" height="172" rx="10" fill="var(--card)" stroke="var(--line)" stroke-opacity=".6"/>
<text x="230" y="458" class="m h" font-size="12">TRANSCRIPT</text>
<rect x="296" y="470" width="206" height="48" rx="10" fill="var(--b-head)"/>
<text x="310" y="490" class="t" font-size="13">Do you drink anything</text>
<text x="310" y="508" class="t" font-size="13">to help you sleep?</text>
<rect x="228" y="530" width="220" height="48" rx="10" fill="var(--g-head)"/>
<text x="242" y="550" class="t" font-size="13">Um… a glass or two of</text>
<text x="242" y="568" class="t" font-size="13">wine, most nights.</text>
<text x="230" y="598" class="m i" font-size="11.5">example exchange</text>

<!-- student <-> browser -->
<path d="M126 384 H192" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arB)"/>
<text x="159" y="376" text-anchor="middle" class="t" font-size="12.5">speaks</text>
<path d="M192 420 H126" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arB)" stroke-dasharray="6 4"/>
<text x="159" y="438" text-anchor="middle" class="t" font-size="12.5">hears</text>

<!-- ============ Gemini Live ============ -->
<rect x="640" y="290" width="530" height="334" rx="14" fill="var(--g-soft)" stroke="var(--g)" stroke-width="1.5"/>
<path d="M640 304 a14 14 0 0 1 14 -14 h502 a14 14 0 0 1 14 14 v26 h-530 z" fill="var(--g-head)"/>
<text x="905" y="315" text-anchor="middle" class="t h" font-size="16">Gemini Live API · one speech-to-speech model</text>

<g font-size="13">
 <rect x="664" y="346" width="482" height="30" rx="6" fill="var(--row)"/>
 <text x="680" y="366" class="h" style="fill:var(--rowtxt)">Listen</text>
 <text x="760" y="366" style="fill:var(--rowtxt)">hears the audio and decides when the question has ended</text>

 <rect x="664" y="390" width="482" height="30" rx="6" fill="var(--row)"/>
 <text x="680" y="410" class="h" style="fill:var(--rowtxt)">Respond</text>
 <text x="760" y="410" style="fill:var(--rowtxt)">answers as the patient, from the prompt, as speech</text>

 <rect x="664" y="434" width="482" height="30" rx="6" fill="var(--row)"/>
 <text x="680" y="454" class="h" style="fill:var(--rowtxt)">Transcribe</text>
 <text x="760" y="454" style="fill:var(--rowtxt)">writes down what each side said</text>
</g>
<text x="905" y="500" text-anchor="middle" class="t" font-size="13">No separate speech-to-text or text-to-speech step:</text>
<text x="905" y="519" text-anchor="middle" class="t" font-size="13">audio goes in and audio comes out.</text>
<text x="905" y="560" text-anchor="middle" class="m" font-size="12.5">If the student starts talking over the patient, the model stops</text>
<text x="905" y="578" text-anchor="middle" class="m" font-size="12.5">and signals the browser to cut playback.</text>

<!-- browser <-> gemini -->
<path d="M530 372 H632" fill="none" stroke="var(--ink)" stroke-width="2.4" marker-end="url(#arB)"/>
<text x="585" y="362" text-anchor="middle" class="t h" font-size="12.5">voice</text>
<path d="M632 430 H530" fill="none" stroke="var(--ink)" stroke-width="2.4" marker-end="url(#arB)" stroke-dasharray="7 4"/>
<text x="585" y="452" text-anchor="middle" class="t h" font-size="12.5">voice +</text>
<text x="585" y="468" text-anchor="middle" class="t h" font-size="12.5">transcripts</text>
<text x="585" y="498" text-anchor="middle" class="m" font-size="11.5">one live</text>
<text x="585" y="513" text-anchor="middle" class="m" font-size="11.5">connection</text>
</svg>
</body></html>
